<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>CHEM 3A retake class report</title>
<style>
:root{--ink:#26324a;--muted:#5d6780;--line:#dfe4f2;--good:#23805a;--warn:#a96a10;--bad:#c23b3b;--accent:#4a58c9}
*{box-sizing:border-box}body{margin:0;background:#f5f7fd;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 56px}h1{font-size:1.5rem;margin:0}h2{font-size:1.1rem;margin:0 0 10px}.sub{color:var(--muted);margin:3px 0 14px}
.days{display:flex;gap:6px;margin-bottom:12px}.days button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}.days button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.kpi,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.kpi b{display:block;font-size:1.7rem;line-height:1.1}.kpi span{color:var(--muted);font-size:.84rem}.panel{margin-top:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 92px 74px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid #eef1f8}.row:first-of-type{border-top:0}.row small{display:block;color:var(--muted)}.pct{text-align:right;font-weight:800}.bar{height:9px;border-radius:9px;background:#e9edf7;overflow:hidden}.bar i{display:block;height:100%}.few{color:var(--muted)!important;font-weight:600}
.empty,#status{color:var(--muted)}#status{min-height:1.4em;margin:6px 0}@media(max-width:520px){.kpi{padding:10px}.kpi b{font-size:1.3rem}.row{grid-template-columns:minmax(0,1fr) 56px 62px}}
</style></head><body><main class="wrap">
<h1>CHEM 3A retake class report</h1><p class="sub">Which skills students miss most. Anonymous practice data, with no names or student IDs.</p>
<div class="days" role="group" aria-label="Time range"><button data-days="7">7 days</button><button data-days="30">30 days</button><button data-days="90">90 days</button></div>
<p id="status" role="status"></p><div id="out"></div>
</main><script>
const STATS_URL='https://script.google.com/macros/s/AKfycbylSKoW9GE6AkN4HiC1uts3Y5Z4oUPHY7OQ88vXrjpcanooloYRTIGW9cS5n0dulp4vQg/exec';
const C={"course":"CHEM 3A","game":"retakeprep","exams":[1,2],"skills":{"sfCount":[1,"Counting sig figs"],"measure":[1,"Reading instruments"],"roundSF":[1,"Rounding to sig figs"],"roundDP":[1,"Rounding to decimal places"],"sciNot":[1,"Scientific notation"],"exactSF":[1,"Exact numbers"],"healthTablets":[1,"Health conversions (tablets)"],"metricL":[1,"Metric volume conversions"],"metricG":[1,"Metric mass/length conversions"],"densityLab":[1,"Density by displacement"],"addSF":[1,"Adding with sig figs"],"healthDose":[1,"Dosage calculations"],"ionConcept":[1,"Atomic particles & ions"],"avgMass":[1,"Average atomic mass"],"atomChart":[1,"Atom/ion chart & Bohr model"],"whichElement":[1,"Identify the element"],"nuclearTable":[1,"Nuclear symbols table"],"ionCharge":[1,"Predictable ion charges"],"physChem":[1,"Physical vs chemical change"],"fullCfg":[1,"Full electron configuration"],"nobleCfg":[1,"Noble gas configuration (ions)"],"particles":[1,"Particle diagrams"],"orbital":[1,"Orbital diagrams"],"lewisDot":[1,"Lewis dot symbols"],"nameCmpd":[1,"Naming ionic compounds"],"writeFormula":[1,"Writing formulas"],"tempConvert":[1,"Temperature conversions"],"densityFactor":[1,"Density as a conversion factor"],"prefixes":[1,"Metric prefixes (µ, n)"],"periodicTrend":[1,"Periodic trends"],"valenceCore":[1,"Valence, core & unpaired electrons"],"shellCount":[1,"Shells, subshells & orbitals"],"emSpectrum":[1,"EM spectrum"],"sciTerms":[1,"Atomic theory & science terms"],"statesMatter":[1,"Solid, liquid or gas"],"diatomic":[1,"Diatomic elements"],"nameMixed":[2,"Naming: ionic, molecular, acids"],"formulaMixed":[2,"Formulas: ionic, molecular, acids"],"molarMass":[2,"Molar mass"],"gToMol":[2,"Grams ↔ moles"],"molToParticles":[2,"Moles ↔ particles"],"pctComp":[2,"Percent composition"],"empirical":[2,"Empirical formula"],"molecular":[2,"Molecular formula"],"valenceCount":[2,"Counting valence electrons"],"electronGroups":[2,"Counting electron groups"],"vsepr":[2,"VSEPR shape & angle"],"bondType":[2,"Bond type"],"polarity":[2,"Molecular polarity"],"resonance":[2,"Resonance structures"],"imfBetween":[2,"IMFs between molecules"],"qmcdt":[2,"q = m·c·ΔT"],"heatMulti":[2,"Heat with a phase change"],"heatCurve":[2,"Heating curve"],"phaseNames":[2,"Phase changes"],"solidType":[2,"Types of solids"],"wordEquation":[2,"Words → balanced equation"],"rxnType2":[2,"Reaction types (with subtypes)"],"netIonic":[2,"Net ionic equations"],"oxStates":[2,"Oxidation states"],"redoxIdentify":[2,"Oxidized / reduced / agents"],"enTrend":[2,"Electronegativity trend"],"lonePairs":[2,"Lone pairs on central atom"],"imfType":[2,"Intermolecular forces"],"phaseHeat":[2,"Heat of fusion/vaporization"],"bpRank":[2,"Boiling point ranking"],"propRank":[2,"Ranking by IMF strength"],"endoExo":[2,"Endothermic vs exothermic"],"balance":[2,"Balancing equations"],"rxnType":[2,"Reaction types"],"solubility":[2,"Solubility rules"],"predictPpt":[2,"Predicting precipitates"],"massConserve":[2,"Conservation of mass"],"lewisDraw":[2,"Drawing Lewis structures"]}},MIN=5;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b?Math.round(a/b*100):0,col=p=>p>=80?'var(--good)':p>=60?'var(--warn)':'var(--bad)',isOk=v=>v===true||v==='true'||v===1||v==='TRUE';
const line=(n,sub,ok,tot)=>{const p=pct(ok,tot),few=tot<MIN;return '<div class="row"><div>'+esc(n)+'<small>'+esc(sub)+'</small></div><div class="bar" aria-hidden="true"><i style="width:'+p+'%;background:'+(few?'#aab3c9':col(p))+'"></i></div><div class="pct'+(few?' few':'')+'" style="'+(few?'':'color:'+col(p))+'">'+p+'%</div></div>'};
const count=(tot,s)=>tot+' answer'+(tot===1?'':'s')+(s?', '+s+' session'+(s===1?'':'s'):'')+(tot<MIN?' (too few to judge)':'');
let days=30;document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{days=+b.dataset.days;load()});
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
async function load(){document.querySelectorAll('[data-days]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.days===days));$('status').textContent='Loading the last '+days+' days…';
 try{const sum=await getJSON(STATS_URL+'?days='+days);render(sum);$('status').textContent=''}catch(e){$('status').textContent='Could not reach the stats service. Try again in a minute.'}}
function render(sum){
 const g=(sum.games||[]).find(x=>x.game===C.game)||{answers:0,wrong:0,sessions:0},known=new Set(Object.values(C.skills).map(x=>x[1])),T={},S={};
 (sum.topics||[]).filter(t=>t.game===C.game).forEach(t=>{const m=String(t.topic).match(/^Exam (\d+): (.+)$/);if(!m)return;const e=+m[1],name=m[2];if(known.has(name)){const k=e+'|'+name,y=S[k]=S[k]||{e,name,n:0,ok:0};y.n+=t.answers;y.ok+=t.answers-t.wrong}else{const x=T[t.topic]=T[t.topic]||{n:0,w:0};x.n+=t.answers;x.w+=t.wrong}});
 const list=Object.values(S),rank=(a,b)=>pct(a.ok,a.n)-pct(b.ok,b.n)||b.n-a.n,worst=list.filter(x=>x.n>=MIN).sort(rank).slice(0,5);
 let h='<div class="kpis"><div class="kpi"><b>'+g.answers+'</b><span>questions answered</span></div><div class="kpi"><b>'+g.sessions+'</b><span>practice sessions</span></div><div class="kpi"><b>'+(g.answers?pct(g.answers-g.wrong,g.answers)+'%':'–')+'</b><span>fully correct</span></div></div>';
 h+='<section class="panel"><h2>Review these first</h2>'+(worst.length?worst.map(x=>line(x.name,'Exam '+x.e+', '+count(x.n),x.ok,x.n)).join(''):'<p class="empty">Not enough skill data yet. A skill appears here after '+MIN+' answers.</p>')+'</section>';
 C.exams.forEach(e=>{const it=list.filter(x=>x.e===e).sort(rank),sec=Object.keys(T).filter(t=>t.indexOf('Exam '+e+':')===0).sort((a,b)=>pct(T[a].n-T[a].w,T[a].n)-pct(T[b].n-T[b].w,T[b].n));
  h+='<section class="panel"><h2>Exam '+e+'</h2>'+(it.length?it.map(x=>line(x.name,count(x.n),x.ok,x.n)).join(''):(sec.length?'':'<p class="empty">No practice yet.</p>'))+(sec.length?'<details><summary style="min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer">Earlier data, by section</summary>'+sec.map(t=>line(t.replace(/^Exam \d+: /,''),count(T[t].n),T[t].n-T[t].w,T[t].n)).join('')+'</details>':'')+'</section>'});
 $('out').innerHTML=h}
load();
</script></body></html>
